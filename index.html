<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MJ ATP Bilder</title>
  <meta name="description" content="Temporäre Artikelbilder für MJ ATP">
  <style>
    :root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#102a43;background:#eef4f8}
    *{box-sizing:border-box}body{margin:0}.top{padding:32px max(22px,calc((100vw - 1160px)/2));background:linear-gradient(120deg,#102a43,#1674bb);color:#fff}.brand{display:flex;gap:13px;align-items:center}.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:12px;background:#fff;color:#1674bb;font-weight:900;font-size:20px}.top h1{margin:0;font-size:27px}.top p{margin:5px 0 0;color:#d7ebf8}.main{max-width:1160px;margin:0 auto;padding:28px 22px 55px}.controls{display:flex;gap:12px;align-items:center;margin-bottom:23px}.controls input{flex:1;min-width:0;border:1px solid #aec4d5;border-radius:10px;padding:13px 15px;font:inherit;background:#fff}.count{font-weight:700;color:#486581;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:18px}.card{padding:0;text-align:left;background:#fff;border:1px solid #d3e0e9;border-radius:15px;overflow:hidden;box-shadow:0 3px 11px #102a4310;cursor:pointer;transition:transform .15s,box-shadow .15s}.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 7px 18px #102a4320;outline:3px solid #78b7e6}.photos{display:grid;grid-template-columns:repeat(3,1fr);height:150px;background:#dce8f1}.photos img{width:100%;height:150px;object-fit:cover;border-right:1px solid #fff}.photos img:last-child{border:0}.body{padding:16px}.part{font-size:19px;font-weight:850;letter-spacing:.25px;overflow-wrap:anywhere}.meta{margin-top:7px;display:flex;gap:7px;flex-wrap:wrap;color:#54718a;font-size:13px}.pill{background:#e8f3fb;color:#1769aa;border-radius:999px;padding:4px 8px;font-weight:700}.hint{display:block;margin-top:11px;color:#1674bb;font-size:13px;font-weight:700}.empty{grid-column:1/-1;background:#fff;border:1px dashed #a9c2d3;border-radius:15px;padding:45px;text-align:center;color:#54718a}.foot{color:#668199;text-align:center;font-size:13px;margin-top:30px}.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:22px;background:#061b2bd9}.modal.open{display:flex}.viewer{position:relative;width:min(1080px,100%);max-height:94vh;background:#fff;border-radius:16px;overflow:auto;box-shadow:0 20px 70px #0008}.viewer-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 18px;background:#fff;border-bottom:1px solid #d3e0e9}.viewer-head b{font-size:18px}.close{padding:8px 12px;border:1px solid #9cb7ca;background:#fff;border-radius:8px;color:#123d5d;font-weight:800;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:18px}.photo-link{display:block;border-radius:10px;overflow:hidden;background:#edf3f7;border:1px solid #d3e0e9}.photo-link img{display:block;width:100%;height:210px;object-fit:contain;background:#fff}.photo-link span{display:block;padding:8px 10px;color:#486581;font-size:12px;font-weight:700}.modal-note{padding:0 18px 18px;margin:0;color:#54718a;font-size:13px}@media(max-width:520px){.top{padding:22px}.main{padding:20px 14px}.controls{display:block}.count{display:block;margin-top:8px}.photos,.photos img{height:130px}.gallery{grid-template-columns:1fr;padding:12px}.photo-link img{height:260px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><div class="mark">MJ</div><div><h1>MJ ATP Bilder</h1><p>Temporäre Produktbilder für eBay-Artikel</p></div></div></header>
  <main class="main">
    <div class="controls"><input id="search" type="search" placeholder="Artikelnummer oder Datum suchen" autocomplete="off"><span id="count" class="count"></span></div>
    <section id="grid" class="grid"><div class="empty">Bilder werden geladen …</div></section>
    <p id="updated" class="foot"></p>
  </main>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="galleryTitle"><section class="viewer"><div class="viewer-head"><b id="galleryTitle">Artikelbilder</b><button id="close" class="close" type="button">Schließen</button></div><div id="gallery" class="gallery"></div><p class="modal-note">Ein Bild anklicken, um seine direkte öffentliche Bild-URL in voller Größe zu öffnen.</p></section></div>
  <script>
    let articles=[];
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const modal=document.querySelector('#modal');
    function openArticle(index){
      const article=articles[index]; if(!article)return;
      document.querySelector('#galleryTitle').textContent=article.partNumber+' – '+((article.photos||[]).length)+' Bilder';
      document.querySelector('#gallery').innerHTML=(article.photos||[]).map((p,i)=>'<a class="photo-link" href="'+encodeURI(p.url)+'" target="_blank" rel="noopener" title="Bild in voller Größe öffnen"><img loading="lazy" src="'+encodeURI(p.url)+'" alt="'+esc(article.partNumber)+' – Bild '+(i+1)+'"><span>Bild '+(i+1)+' · direkte URL öffnen</span></a>').join('');
      modal.classList.add('open'); document.querySelector('#close').focus();
    }
    function closeGallery(){modal.classList.remove('open')}
    function draw(){
      const query=document.querySelector('#search').value.trim().toLowerCase();
      const shown=articles.map((a,index)=>({a,index})).filter(({a})=>[a.partNumber,a.date,a.shelf].join(' ').toLowerCase().includes(query));
      document.querySelector('#count').textContent=shown.length+' Artikel';
      document.querySelector('#grid').innerHTML=shown.length?shown.map(({a,index})=>{
        const pictures=(a.photos||[]).slice(0,3).map(p=>'<img loading="lazy" src="'+encodeURI(p.url)+'" alt="'+esc(a.partNumber)+'">').join('');
        return '<article class="card" data-index="'+index+'" role="button" tabindex="0" aria-label="'+esc(a.partNumber)+' Bilder öffnen"><div class="photos">'+pictures+'</div><div class="body"><div class="part">'+esc(a.partNumber)+'</div><div class="meta"><span class="pill">'+esc(a.date)+'</span>'+(a.shelf?'<span class="pill">Regal '+esc(a.shelf)+'</span>':'')+'<span>'+((a.photos||[]).length)+' Bild(er)</span></div><span class="hint">Alle Bilder öffnen</span></div></article>';
      }).join(''):'<div class="empty">Noch keine passenden Bilder vorhanden.</div>';
    }
    async function load(){
      try{const r=await fetch('./manifest.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();articles=Array.isArray(data.articles)?data.articles:[];document.querySelector('#updated').textContent=data.updatedAt?'Letzte Aktualisierung: '+new Date(data.updatedAt).toLocaleString('de-DE'):'';draw()}catch{document.querySelector('#grid').innerHTML='<div class="empty">Noch keine Bilder hochgeladen. Sobald ein Artikel in MJ ATP Fotos abgeschlossen wird, erscheinen die Bilder hier.</div>'}
    }
    document.querySelector('#search').addEventListener('input',draw);
    document.querySelector('#grid').addEventListener('click',event=>{const card=event.target.closest('.card[data-index]');if(card)openArticle(Number(card.dataset.index))});
    document.querySelector('#grid').addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.closest('.card[data-index]')){event.preventDefault();openArticle(Number(event.target.closest('.card[data-index]').dataset.index))}});
    document.querySelector('#close').addEventListener('click',closeGallery);
    modal.addEventListener('click',event=>{if(event.target===modal)closeGallery()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeGallery()});
    load();
  </script>
</body>
</html>
